name: Build Atmosphere

on:
  push:
    branches:
    - aquahax
  workflow_dispatch:

jobs:
  Compile:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest # debian + dkp-pacman image

    steps:
    - name: install deps
      run: |
        # github releaser
        wget -q https://github.com/cli/cli/releases/download/v2.54.0/gh_2.54.0_linux_amd64.tar.gz
        tar xf gh_2.54.0_linux_amd64.tar.gz
        mv ./gh_2.54.0_linux_amd64/bin/gh /__w/gh # idk
        rm -rf ./gh_2.54.0_linux_amd64 gh_2.54.0_linux_amd64.tar.gz
        git config --global --add safe.directory /__w/Atmosphere/Atmosphere

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: '1'
        ref: 'aquahax'

    - name: Build
      run: make

    - name: Create Release
      run: /__w/gh release create --target aquahax $(date +%Y-%m-%d)-${{ github.sha }} out/nintendo_nx_arm64_armv8a/release/atmosphere-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

